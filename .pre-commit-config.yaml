repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.2.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
- repo: local
  hooks:
  - id: build-ospo-code-scanner-container
    name: Bootstrap Alliander OSPO Code Scanner Container for self-test
    language: script
    entry: ./pre-commit/build-scanner
    always_run: true
    pass_filenames: true
    files: ^.*$
  - id: vale
    name: Perform linguistic linting
    language: docker_image
    entry: --entrypoint vale ospo-code-scanner
    pass_filenames: false
    always_run: true
    require_serial: true
  - id: ort
    name: OSS review toolkit scan
    language: docker_image
    entry: --entrypoint ort ospo-code-scanner
    pass_filenames: false
    always_run: true
    require_serial: true
