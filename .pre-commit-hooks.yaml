- id: vale
  name: Perform linguistic linting
  language: docker_image
  # For local development use tag of built container 'ospo-code-scanner'
  entry: --entrypoint vale ghcr.io/<owner>/ospo-code-scanner:<version>
  pass_filenames: false
  always_run: true
  require_serial: true
- id: ort
  name: OSS review toolkit scan
  language: docker_image
  # For local development use tag of built container 'ospo-code-scanner'
  entry: --entrypoint ort ghcr.io/<owner>/ospo-code-scanner:<version>
  pass_filenames: false
  always_run: true
  require_serial: true
